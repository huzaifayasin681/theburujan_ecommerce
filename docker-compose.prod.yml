services:
  mysql:
    container_name: burujan_mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-burujan}
      MYSQL_USER: ${MYSQL_USER:-burujan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - burujan-network

  redis:
    container_name: burujan_redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - burujan-network

  minio:
    container_name: burujan_minio
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      # Bound to localhost for security
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - burujan-network

  api:
    container_name: burujan_api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-burujan}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-burujan}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    ports:
      # Expose only to host loopback so Nginx handles public traffic
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - burujan-network

  web:
    container_name: burujan_web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: https://theburujan.shop
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Expose only to host loopback so Nginx handles public traffic
      - "127.0.0.1:3000:3000"
    networks:
      - burujan-network

networks:
  burujan-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:

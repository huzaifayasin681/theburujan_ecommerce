# Nginx server block for theburujan.shop & www.theburujan.shop
# Place in /etc/nginx/sites-available/theburujan.shop and symlink to /etc/nginx/sites-enabled/

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name theburujan.shop www.theburujan.shop;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://theburujan.shop$request_uri;
    }
}

# 2. Redirect www.theburujan.shop to non-www canonical
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.theburujan.shop;

    ssl_certificate /etc/letsencrypt/live/theburujan.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theburujan.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://theburujan.shop$request_uri;
}

# 3. Main HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name theburujan.shop;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/theburujan.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theburujan.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hardened Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 50M;

    # 1. Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Proxy API requests to NestJS Backend
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4005/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Proxy public media storage directly to MinIO
    location /storage/ {
        proxy_pass http://127.0.0.1:9005/burujan/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. Proxy all frontend requests to Next.js Web
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

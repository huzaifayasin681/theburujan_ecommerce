services:
  mysql:
    container_name: burujan_mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: burujan
      MYSQL_USER: burujan
      MYSQL_PASSWORD: burujan
      MYSQL_ROOT_PASSWORD: local-root-change-me
    volumes: [mysql-data:/var/lib/mysql]
    ports: ["33219:3306"]
    healthcheck: {test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    container_name: burujan_redis
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    ports: ["33220:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    container_name: burujan_minio
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: change-me}
    volumes: [minio-data:/data]
    ports: ["33221:9000", "33222:9001"]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    ports: ["4000:4000"]
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"], interval: 10s, timeout: 5s, retries: 10}
  web:
    build: {context: ., dockerfile: apps/web/Dockerfile, args: {NEXT_PUBLIC_API_URL: /api/v1}}
    environment: {APP_URL: http://localhost:3000, NEXT_PUBLIC_API_URL: /api/v1, INTERNAL_API_URL: http://api:4000/api/v1}
    depends_on: {api: {condition: service_healthy}}
    ports: ["3000:3000"]
volumes: {mysql-data: {}, redis-data: {}, minio-data: {}}
